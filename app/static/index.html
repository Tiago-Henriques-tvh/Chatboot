<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentic RAG Chat</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif; background: #0f1115;
      color: #e6e6e6; display: flex; flex-direction: column; height: 100vh;
    }
    header {
      padding: 14px 20px; background: #161923; border-bottom: 1px solid #262b38;
      font-weight: 600;
    }
    header small { color: #8a93a6; font-weight: 400; }
    #log {
      flex: 1; overflow-y: auto; padding: 20px; display: flex;
      flex-direction: column; gap: 14px;
    }
    .msg { max-width: 760px; padding: 12px 16px; border-radius: 12px;
      white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #2563eb; }
    .bot { align-self: flex-start; background: #1c2230; border: 1px solid #262b38; }
    form { display: flex; gap: 10px; padding: 16px 20px; background: #161923;
      border-top: 1px solid #262b38; }
    input {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2b3242;
      background: #0f1115; color: #e6e6e6; font-size: 15px;
    }
    button {
      padding: 12px 20px; border: none; border-radius: 10px; background: #2563eb;
      color: white; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>🧠 Agentic RAG Backend <small>&nbsp;· local Ollama + Qdrant · SSE stream</small></header>
  <div id="log"></div>
  <form id="form">
    <input id="prompt" autocomplete="off" placeholder="Ask about your training logs, the web, or request a plan..." />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("form");
    const input = document.getElementById("prompt");
    const sendBtn = document.getElementById("send");

    function addMsg(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = input.value.trim();
      if (!prompt) return;
      addMsg(prompt, "user");
      input.value = "";
      sendBtn.disabled = true;
      const bot = addMsg("", "bot");

      try {
        const res = await fetch("/api/chat/stream", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n\n");
          buffer = parts.pop();
          for (const part of parts) {
            const line = part.replace(/^data: /, "").trim();
            if (!line || line === "[DONE]") continue;
            try {
              const obj = JSON.parse(line);
              if (obj.token) { bot.textContent += obj.token; }
              else if (obj.error) { bot.textContent += "\n[error] " + obj.error; }
            } catch (_) {}
          }
          log.scrollTop = log.scrollHeight;
        }
      } catch (err) {
        bot.textContent += "\n[network error] " + err;
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
